<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book a Session | Foteate with Aura</title>
    <meta name="description" content="Contact page to book a photography session with Foteate with Aura.">
    <meta name="author" content="Jared Huayta">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Open+Sans:wght@300;400;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="styles/foteate.css">

    <link rel="icon" href="images/logo.png" type="image/png">
    <script src="scripts/foteate.js" defer></script>
</head>

<body>
    <header>
        <div class="brand">
            <img src="images/logo.png" alt="Logo of Foteate with Aura" class="logo">
            <h1>Foteate with Aura</h1>
            <button id="menu" class="menu" aria-label="Open menu" aria-expanded="false"
                aria-controls="primary-nav">☰</button>
        </div>
        <nav id="primary-nav" class="nav" aria-label="Main navigation">
            <a href="index.html">Home</a>
            <a href="services.html">Services</a>
            <a href="book.html">Book with Us</a>
        </nav>

    </header>

    <main>
        <section class="contact">
            <h2>Book a Session 📸</h2>
            <p>We’d love to capture your best moments! Fill out the form below and we’ll get back to you soon.</p>

            <form id="bookingForm" class="booking-form">
                <div class="form-group">
                    <label for="name">Full Name <span class="required">*</span></label>
                    <input type="text" id="name" name="name" required placeholder="Your name" />
                </div>

                <div class="form-group">
                    <label for="email">Email Address <span class="required">*</span></label>
                    <input type="email" id="email" name="email" required placeholder="you@example.com" />
                </div>

                <div class="form-group">
                    <label for="session">Session Type <span class="required">*</span></label>
                    <select id="session" name="session" required>
                        <option value="">Loading options...</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="message">Additional Details</label>
                    <textarea id="message" name="message" rows="4" placeholder="Tell us more..."></textarea>
                </div>

                <button type="submit" class="btn">Submit Booking</button>
            </form>
        </section>

        <!-- Thank You Modal -->
        <div id="thankYouModal" class="modal">
            <div class="modal-content">
                <p id="thankYouMessage"></p>
            </div>
        </div>
    </main>

    <footer>
        <nav class="footer-nav" aria-label="Footer navigation">
            <a href="index.html">Home</a>
            <a href="services.html">Services</a>
            <a href="book.html">Book with Us</a>
        </nav>
        <p><small>&copy; 2025 Jared Huayta. Lima, Perú.</small></p>
    </footer>

</body>

</html>
